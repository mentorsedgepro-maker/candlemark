<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trading Tools: Calendar, Signals, Trader's Gym</title>
<script src="theme.js"></script>
<meta name="description" content="Economic calendar, trade signals and a practice gym for traders.">
<link rel="canonical" href="https://mentorsedgepro.co/tools">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2272E6">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MentorsEdgePro">
<meta property="og:title" content="Trading Tools: Calendar, Signals, Trader's Gym">
<meta property="og:description" content="Economic calendar, trade signals and a practice gym for traders.">
<meta property="og:url" content="https://mentorsedgepro.co/tools">
<meta property="og:image" content="https://mentorsedgepro.co/og.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.tl{max-width:var(--container);margin:0 auto;padding:110px 24px 60px}
.tl h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:6px 0 12px}
.tl .lead{color:var(--text-secondary);max-width:660px;margin-bottom:28px}
.tl h2{font-size:1.15rem;margin:26px 0 8px}.tl p{color:var(--text-secondary);margin-bottom:10px;max-width:720px}
.tl a.tool-card{display:block}
.tl-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.tl-tabs a{padding:8px 14px;border:1px solid var(--line);border-radius:100px;font-size:13px;font-weight:600;color:var(--text-secondary)}
.tl-tabs a.on,.tl-tabs a:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.tl-soon{display:inline-block;font:11px var(--font-mono);color:var(--gold);border:1px solid var(--gold-dim);border-radius:100px;padding:3px 10px;margin-bottom:14px}
.tl-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:8px 20px;overflow-x:auto}
.tl table{width:100%;border-collapse:collapse;min-width:620px}
.tl th{text-align:left;font:500 10.5px var(--font-mono);text-transform:uppercase;color:var(--text-tertiary);padding:14px 8px 10px}
.tl td{padding:12px 8px;border-top:1px solid var(--line);font-size:13.5px}
.tl td.m{font-family:var(--font-mono);color:var(--text-secondary)}
.imp{font:600 10.5px var(--font-mono);padding:3px 9px;border-radius:100px}
.imp.High{color:var(--bear);background:var(--bear-dim)}.imp.Medium{color:var(--gold);background:var(--gold-dim)}.imp.Low,.imp.Holiday{color:var(--text-tertiary);background:rgba(34,114,230,0.085)}
.tl-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tl-bar button{padding:7px 14px;border:1px solid var(--line);border-radius:100px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.tl-bar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tl-risk{font-size:.78rem;color:var(--text-tertiary);margin-top:28px;line-height:1.7}
.tl-cta{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="nav scrolled"><div class="nav-inner">
  <a href="index.html" class="brand"><span class="brand-word">Mentorsedge<em>Pro</em></span></a>
  <div class="nav-actions"><a href="login.html" class="btn-ghost">Log in</a><a href="register.html" class="btn-solid"><span>Get Started</span></a></div>
</div></header>
<main class="tl" id="tl"></main>

<script src="config.js"></script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = {
  calendar: ['Economic Calendar', 'See which scheduled releases can move the markets this week.'],
  signals: ['Signal Centre', 'Trading ideas, sourced and scored.'],
  gym: ["Trader's Gym", 'Practise a strategy on historical data.'],
  education: ['Education', 'Learn the basics and review trading risks.'],
};
const LIVE = ['calendar','education','gym','signals'];
const SOON = {};
const RISK = '<p class="tl-risk"><strong>Risk warning:</strong> Trading leveraged products carries a high risk of loss. Information here is general, not investment advice. Prices and account information may be delayed, incomplete, or unverified as live.</p>';
const CTA = '<div class="tl-cta"><a href="register.html" class="btn-solid"><span>Create an account</span></a><a href="mentorboard.html" class="btn-outline"><span>Browse mentors</span></a></div>';
const root = document.getElementById('tl');
const key = new URLSearchParams(location.search).get('p');
const toolHref = (k) => k === 'signals' ? 'signal-centre.html' : `tools.html?p=${k}`;
const tabs = (k) => `<div class="tl-tabs">${Object.entries(T).map(([x, v]) => `<a href="${toolHref(x)}" class="${x === k ? 'on' : ''}">${esc(v[0])}</a>`).join('')}</div>`;

if (key === 'signals') {
  location.replace('signal-centre.html');
} else if (!T[key]) {
  document.title = 'Tools — mentorsedgepro';
  root.innerHTML = `<span class="eyebrow">Tools</span><h1>Tools for people who check their work</h1><p class="lead">What is live and what is still on the way is marked on each page.</p>
    <div class="tool-grid">${Object.entries(T).map(([k, v]) => `<a class="tool-card" href="${toolHref(k)}"><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p><p style="margin-top:10px;font:12px var(--font-mono);color:${LIVE.includes(k) ? 'var(--brand)' : 'var(--gold)'}">${LIVE.includes(k) ? 'Live' : 'Coming soon'}</p></a>`).join('')}</div>${RISK}`;
} else if (key === 'calendar') {
  document.title = 'Economic Calendar — mentorsedgepro';
  root.innerHTML = `<span class="eyebrow">Tools</span><h1>${T.calendar[0]}</h1><p class="lead">${T.calendar[1]} Times are shown in your local time zone.</p>${tabs(key)}
    <div class="tl-bar" id="bar"><button class="on" data-i="all">All</button><button data-i="High">High impact</button><button data-i="Medium">Medium</button></div>
    <div class="tl-card" id="cal"><p style="padding:20px;color:var(--text-tertiary)">Loading…</p></div>${CTA}${RISK}`;
  let rows = [], f = 'all';
  const draw = () => {
    const list = rows.filter((e) => f === 'all' || e.impact === f);
    document.getElementById('cal').innerHTML = list.length ? `<table><thead><tr><th>Time</th><th>Ccy</th><th>Event</th><th>Impact</th><th>Forecast</th><th>Previous</th></tr></thead><tbody>${list.map((e) => {
      const d = new Date(e.date), ok = !isNaN(d);
      return `<tr><td class="m">${ok ? d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) + '<br>' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—'}</td><td><strong>${esc(e.ccy)}</strong></td><td>${esc(e.title)}</td><td><span class="imp ${esc(e.impact)}">${esc(e.impact)}</span></td><td class="m">${esc(e.forecast) || '—'}</td><td class="m">${esc(e.previous) || '—'}</td></tr>`;
    }).join('')}</tbody></table>` : '<p style="padding:20px;color:var(--text-tertiary)">No events to show right now.</p>';
  };
  document.getElementById('bar').onclick = (e) => { const b = e.target.closest('[data-i]'); if (!b) return; document.querySelectorAll('#bar button').forEach((x) => x.classList.toggle('on', x === b)); f = b.dataset.i; draw(); };
  fetch(API_BASE + '/calendar').then((r) => { if (!r.ok) throw new Error('Calendar request failed'); return r.json(); }).then((d) => { rows = d.items; draw(); })
    .catch(() => { document.getElementById('cal').innerHTML = '<p style="padding:20px;color:var(--text-tertiary)">Calendar unavailable right now.</p>'; });
} else if (key === 'education') {
  document.title = 'Education — mentorsedgepro';
  root.innerHTML = `<span class="eyebrow">Tools</span><h1>${T.education[0]}</h1><p class="lead">${T.education[1]}</p>${tabs(key)}
    <h2>Account features</h2><p>Available features may vary by account and location. Review the applicable provider terms and confirm whether activity is live before making a trading decision.</p>
    <h2>The basics</h2><p><strong>Buy or sell:</strong> buy if you think the price will rise, sell if you think it will fall.</p><p><strong>Stop loss:</strong> an exit that closes a trade at a loss level you choose, to cap what you can lose.</p><p><strong>Take profit:</strong> an exit that closes a trade once it reaches a profit level you choose.</p><p><strong>Copytrading:</strong> your account automatically mirrors the trades of a mentor you pick. You can pause or stop at any time.</p>
    <h2>Before you copy anyone</h2><p>Check the mentor's risk rating, win rate and number of trades on the <a href="mentorboard.html" style="color:var(--brand)">Mentorboard</a>. A high past return can come with high risk, and past results do not predict future ones.</p>${CTA}${RISK}`;
} else if (key === 'gym') {
  document.title = "Trader's Gym — mentorsedgepro";
  root.innerHTML = `<span class="eyebrow">Tools</span><h1>${T.gym[0]}</h1><p class="lead">${T.gym[1]} Practice trades are simulated and never touch your balance.</p>${tabs(key)}
    <div class="tl-bar"><select id="gSym"></select><button id="gNew">New session</button><button id="gPlay">▶ Play</button><button id="gNext">Next candle</button><button id="gBuy">Buy</button><button id="gSell">Sell</button><button id="gClose">Close trade</button></div>
    <div class="tl-card" style="padding:12px"><canvas id="gCv" style="width:100%;height:340px;display:block"></canvas></div>
    <p id="gInfo" class="lead" style="margin-top:12px"></p>${CTA}${RISK}`;
  const g = (id) => document.getElementById(id), cv = g('gCv'), x = cv.getContext('2d');
  g('gSym').innerHTML = ['EUR/USD','GBP/USD','USD/JPY','AAPL','TSLA','BTC/USD','ETH/USD','US500','XAU/USD'].map((s) => `<option>${s}</option>`).join('');
  let C = [], i = 0, pos = null, real = 0, tm = null;
  const stop = () => { clearInterval(tm); tm = null; g('gPlay').textContent = '▶ Play'; };
  const paint = () => {
    const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = r.height * d; x.setTransform(d, 0, 0, d, 0, 0);
    const v = C.slice(Math.max(0, i - 79), i + 1); if (!v.length) return;
    const hi = Math.max(...v.map((c) => c.h)), lo = Math.min(...v.map((c) => c.l)), H = r.height, w = r.width / 80, y = (p) => H - 8 - (p - lo) / (hi - lo || 1) * (H - 16);
    v.forEach((c, k) => { x.strokeStyle = x.fillStyle = c.c >= c.o ? '#0A8A5F' : '#D92D43'; const cx = k * w + w / 2; x.beginPath(); x.moveTo(cx, y(c.h)); x.lineTo(cx, y(c.l)); x.stroke(); x.fillRect(cx - w * .35, Math.min(y(c.o), y(c.c)), w * .7, Math.max(1, Math.abs(y(c.o) - y(c.c)))); });
    const px = C[i].c, u = pos ? pos.s * (px - pos.e) / pos.e * 100 : 0;
    if (pos) { x.setLineDash([5, 4]); x.strokeStyle = '#2272E6'; x.beginPath(); x.moveTo(0, y(pos.e)); x.lineTo(r.width, y(pos.e)); x.stroke(); x.setLineDash([]); }
    g('gInfo').textContent = `${new Date(C[i].t * 1000).toLocaleString()} · Price ${px.toFixed(4)} · ${pos ? (pos.s > 0 ? 'Long' : 'Short') + ' @ ' + pos.e.toFixed(4) + ' (' + u.toFixed(2) + '%)' : 'No open trade'} · Realised ${real.toFixed(2)}%`;
  };
  const next = () => { if (i < C.length - 1) { i++; paint(); } else stop(); };
  const load = async () => {
    stop(); g('gInfo').textContent = 'Loading…';
    const r = await fetch(`${API_BASE}/gym/candles?sym=${encodeURIComponent(g('gSym').value)}&interval=15m&range=1mo`).then((q) => q.json()).catch(() => null);
    if (!r?.items?.length) { g('gInfo').textContent = 'No data for this market right now.'; return; }
    C = r.items; i = Math.min(C.length - 1, 80 + Math.floor(Math.random() * Math.max(1, C.length - 200))); pos = null; real = 0; paint();
  };
  const open = (s) => { if (C.length && !pos) { pos = { e: C[i].c, s }; paint(); } };
  g('gNew').onclick = load; g('gSym').onchange = load; g('gNext').onclick = next;
  g('gPlay').onclick = () => { if (tm) return stop(); g('gPlay').textContent = '❚❚ Pause'; tm = setInterval(next, 600); };
  g('gBuy').onclick = () => open(1); g('gSell').onclick = () => open(-1);
  g('gClose').onclick = () => { if (pos) { real += pos.s * (C[i].c - pos.e) / pos.e * 100; pos = null; paint(); } };
  load();
} else {
  const [title, lead] = T[key];
  document.title = title + ' — mentorsedgepro';
  root.innerHTML = `<span class="eyebrow">Tools</span><h1>${esc(title)}</h1><p class="lead">${esc(lead)}</p>${tabs(key)}<span class="tl-soon">${key === 'vps' ? 'Not offered' : 'Coming soon'}</span>
    ${SOON[key].map(([h, t]) => `<h2>${esc(h)}</h2><p>${esc(t)}</p>`).join('')}${CTA}${RISK}`;
}
</script>
</body>
</html>
